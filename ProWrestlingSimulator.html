<head>
  <meta charset="UTF-8">
  <title>Pro Wrestling Simulator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .nav-tabs {
      display: flex;
      background: #f5f5f5;
      border-bottom: 2px solid #ddd;
    }

    .nav-tab {
      flex: 1;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      background: #f5f5f5;
      border: none;
      font-size: 16px;
      font-weight: 600;
      color: #666;
      transition: all 0.3s;
    }

    .nav-tab:hover {
      background: #e0e0e0;
    }

    .nav-tab.active {
      background: white;
      color: #667eea;
      border-bottom: 3px solid #667eea;
    }

    .tab-content {
      display: none;
      padding: 30px;
    }

    .tab-content.active {
      display: block;
    }

    .wrestler-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .wrestler-card {
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      padding: 20px;
      background: #fafafa;
      transition: all 0.3s;
      cursor: pointer;
    }

    .wrestler-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      border-color: #667eea;
    }

    .wrestler-card h3 {
      color: #333;
      margin-bottom: 10px;
      font-size: 1.3em;
    }

    .wrestler-card .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.9em;
      color: #666;
      margin-top: 10px;
    }

    .wrestler-card .info-item {
      background: white;
      padding: 5px 10px;
      border-radius: 5px;
    }

    .wrestler-card .rating {
      margin-top: 15px;
      padding: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1em;
    }

    .wrestler-detail {
      background: #fafafa;
      border-radius: 10px;
      padding: 30px;
      margin-top: 20px;
    }

    .detail-section {
      margin-bottom: 30px;
    }

    .detail-section h3 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 1.3em;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .attribute-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .attribute-item {
      background: white;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }

    .attribute-item label {
      display: block;
      font-size: 0.9em;
      color: #666;
      margin-bottom: 5px;
    }

    .attribute-item .value {
      font-size: 1.2em;
      font-weight: bold;
      color: #333;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      margin-top: 5px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      border-radius: 4px;
      transition: width 0.3s;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin: 5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #666;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .search-box {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
      transition: border-color 0.3s;
    }

    .search-box:focus {
      outline: none;
      border-color: #667eea;
    }

    .stats-overview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      border: 2px solid #e0e0e0;
    }

    .stat-card .number {
      font-size: 2.5em;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 10px;
    }

    .stat-card .label {
      color: #666;
      font-size: 1em;
    }

      border: 2px solid #333;
      border-radius: 50%;
      margin: 20px auto;
      display: block;
    }

      text-align: center;
      margin: 20px 0;
    }

      background: #666;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 20px;
    }

      background: #555;
    }
  </style>
</head>

  <div class="container">
    <div class="header">
      <h1>Pro Wrestling Simulator</h1>
      <p>Manage your wrestling roster like a pro</p>
    </div>

    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('roster')">Roster</button>
      <button class="nav-tab" onclick="switchTab('details')">Wrestler Details</button>
      <button class="nav-tab" onclick="switchTab('stats')">Statistics</button>
      <button class="nav-tab" onclick="switchTab('spinner')">Spinner</button>
    </div>

    <div id="roster" class="tab-content active">
      <input type="text" class="search-box" id="searchBox" placeholder="Search wrestlers..." onkeyup="searchWrestlers()">
      <div class="actions">
        <button class="btn btn-primary" onclick="loadSampleWrestlers()">Load Sample Data</button>
        <button class="btn btn-secondary" onclick="exportData()">Export Data</button>
        <button class="btn btn-secondary" onclick="clearAllData()">Clear All</button>
      </div>
      <div id="wrestlerGrid" class="wrestler-grid"></div>
    </div>

    <div id="details" class="tab-content">
      <button class="back-btn" onclick="switchTab('roster')">← Back to Roster</button>
      <div id="wrestlerDetail"></div>
    </div>

    <div id="stats" class="tab-content">
      <h2 style="margin-bottom: 20px;">Roster Statistics</h2>
      <div class="stats-overview" id="statsOverview"></div>
      <div class="detail-section">
        <h3>Top 10 Wrestlers by Overall Rating</h3>
        <div id="topWrestlers"></div>
      </div>
    </div>

    <div id="spinner" class="tab-content">
      <h2 style="text-align: center; margin-bottom: 20px;">Random Wrestler Selector</h2>
      <canvas id="wheelCanvas" width="600" height="600"></canvas>
      <div class="actions">
        <button class="btn btn-primary" onclick="spinWheel()">Spin the Wheel!</button>
        <h2 id="result"></h2>
      </div>
    </div>
  </div>

  <script>
    // ========== WRESTLER MODEL ==========
    class Wrestler {
      constructor(data = {}) {
        this.id = data.id || this.generateId();
        this.name = data.name || '';
        this.age = data.age || 18;
        this.sexuality = data.sexuality || 'Heterosexual';
        this.workerType = data.workerType || 'Singles';
        this.status = data.status || 'Active';
        this.workingStyle = data.workingStyle || 'All-Rounder';
        this.height = data.height || 180;
        this.weight = data.weight || 90;
        this.birthDate = data.birthDate || new Date();
        this.debutDate = data.debutDate || new Date();
        this.basedInContinent = data.basedInContinent || 'North America';
        this.basedInCountry = data.basedInCountry || 'USA';
        this.basedInCity = data.basedInCity || '';
        this.popularity = data.popularity || {};
        this.physicalCondition = {
          brain: data.physicalCondition?.brain || 100,
          body: data.physicalCondition?.body || 100,
          neck: data.physicalCondition?.neck || 100,
          chest: data.physicalCondition?.chest || 100,
          legs: data.physicalCondition?.legs || 100,
          arms: data.physicalCondition?.arms || 100
        };
        this.brawling = data.brawling || 50;
        this.technicalWrestling = data.technicalWrestling || 50;
        this.starPower = data.starPower || 50;
        this.highFlying = data.highFlying || 50;
        this.hardcore = data.hardcore || 50;
        this.safety = data.safety || 50;
        this.dramaticActing = data.dramaticActing || 50;
        this.wrestlingPsychology = data.wrestlingPsychology || 50;
        this.fatigue = data.fatigue || 0;
        this.playByPlay = data.playByPlay || 50;
        this.collar = data.collar || 'Blue Collar';
        this.profilePicture = data.profilePicture || null;
      }

      generateId() {
        return 'WR-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
      }

      getOverallRating() {
        const attributes = [
          this.brawling, this.technicalWrestling, this.starPower,
          this.highFlying, this.hardcore, this.safety,
          this.dramaticActing, this.wrestlingPsychology
        ];
        return Math.round(attributes.reduce((a, b) => a + b, 0) / attributes.length);
      }

      getPhysicalConditionRating() {
        const conditions = Object.values(this.physicalCondition);
        return Math.round(conditions.reduce((a, b) => a + b, 0) / conditions.length);
      }

      getYearsOfExperience() {
        const today = new Date();
        const debut = new Date(this.debutDate);
        const years = (today - debut) / (1000 * 60 * 60 * 24 * 365.25);
        return Math.max(0, Math.floor(years));
      }

      toJSON() {
        return {
          id: this.id,
          name: this.name,
          age: this.age,
          sexuality: this.sexuality,
          workerType: this.workerType,
          status: this.status,
          workingStyle: this.workingStyle,
          height: this.height,
          weight: this.weight,
          birthDate: this.birthDate,
          debutDate: this.debutDate,
          basedInContinent: this.basedInContinent,
          basedInCountry: this.basedInCountry,
          basedInCity: this.basedInCity,
          popularity: this.popularity,
          physicalCondition: this.physicalCondition,
          brawling: this.brawling,
          technicalWrestling: this.technicalWrestling,
          starPower: this.starPower,
          highFlying: this.highFlying,
          hardcore: this.hardcore,
          safety: this.safety,
          dramaticActing: this.dramaticActing,
          wrestlingPsychology: this.wrestlingPsychology,
          fatigue: this.fatigue,
          playByPlay: this.playByPlay,
          collar: this.collar,
          profilePicture: this.profilePicture
        };
      }

      static fromJSON(json) {
        return new Wrestler(json);
      }
    }

    class WrestlerManager {
      constructor() {
        this.wrestlers = [];
        this.loadFromStorage();
      }

      addWrestler(wrestlerData) {
        const wrestler = new Wrestler(wrestlerData);
        this.wrestlers.push(wrestler);
        this.saveToStorage();
        return wrestler;
      }

      getWrestlerById(id) {
        return this.wrestlers.find(w => w.id === id);
      }

      getAllWrestlers() {
        return this.wrestlers;
      }

      searchWrestlers(query) {
        const lowerQuery = query.toLowerCase();
        return this.wrestlers.filter(w =>
          w.name.toLowerCase().includes(lowerQuery)
        );
      }

      getTopWrestlers(limit = 10) {
        return [...this.wrestlers]
          .sort((a, b) => b.getOverallRating() - a.getOverallRating())
          .slice(0, limit);
      }

      saveToStorage() {
        if (typeof localStorage !== 'undefined') {
          const data = this.wrestlers.map(w => w.toJSON());
          localStorage.setItem('wrestlers', JSON.stringify(data));
        }
      }

      loadFromStorage() {
        if (typeof localStorage !== 'undefined') {
          const data = localStorage.getItem('wrestlers');
          if (data) {
            const parsed = JSON.parse(data);
            this.wrestlers = parsed.map(w => Wrestler.fromJSON(w));
          }
        }
      }

      clearAll() {
        this.wrestlers = [];
        this.saveToStorage();
      }

      importWrestlers(jsonArray) {
        jsonArray.forEach(data => {
          this.addWrestler(data);
        });
      }

      exportWrestlers() {
        return this.wrestlers.map(w => w.toJSON());
      }
    }

      document.querySelectorAll('.tab-content').forEach(tab => {

      });

      document.getElementById(tabName).classList.add('active');

    let canvas, ctx, resultDisplay;
    let angle = 0;
    let spinning = false;

    function initializeSpinner() {
      canvas = document.getElementById('wheelCanvas');
      ctx = canvas.getContext('2d');
      resultDisplay = document.getElementById('result');

      const wrestlers = manager.getAllWrestlers();
      if (wrestlers.length > 0) {
        drawWheel();
      } else {
        ctx.fillStyle = '#f5f5f5';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#666';
        ctx.font = '20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('No wrestlers available', 300, 300);
      }
    }

    function drawWheel() {
      const wrestlers = manager.getAllWrestlers();
      if (wrestlers.length === 0) return;

      const sectionCount = wrestlers.length;
      const anglePerSection = (2 * Math.PI) / sectionCount;

      for (let i = 0; i < sectionCount; i++) {
        const sectionAngle = i * anglePerSection;
        ctx.beginPath();
        ctx.moveTo(300, 300);
        ctx.arc(300, 300, 300, sectionAngle, sectionAngle + anglePerSection);
        ctx.fillStyle = i % 2 === 0 ? '#fbb' : '#bdf';
        ctx.fill();
        ctx.save();
        ctx.translate(300, 300);
        ctx.rotate(sectionAngle + anglePerSection / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#000';
        ctx.font = '12px sans-serif';
        ctx.fillText(wrestlers[i].name, 290, 5);
        ctx.restore();
      }
    }

    function spinWheel() {
      const wrestlers = manager.getAllWrestlers();
      if (wrestlers.length === 0) {
        alert('Please load wrestler data first!');
        return;
      }

      if (spinning) return;
      spinning = true;

      const spinTime = 4000;
      const start = Date.now();
      const sectionCount = wrestlers.length;
      const anglePerSection = (2 * Math.PI) / sectionCount;

      const spin = () => {
        const elapsed = Date.now() - start;
        angle += 0.05 + (Math.max(0, spinTime - elapsed) / spinTime) * 0.3;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(300, 300);
        ctx.rotate(angle);
        ctx.translate(-300, -300);
        drawWheel();
        ctx.restore();

        if (elapsed < spinTime) {
          requestAnimationFrame(spin);
        } else {
          spinning = false;
          const selected = Math.floor((sectionCount - ((angle % (2 * Math.PI)) / anglePerSection)) % sectionCount);
          const selectedWrestler = wrestlers[selected];
          resultDisplay.textContent = `Selected: ${selectedWrestler.name} (Rating: ${selectedWrestler.getOverallRating()})`;
        }
      };
      spin();
    }

    displayWrestlers();
